<style>
/* Consent widget – prefixed shqc- to avoid conflicts */
.shqc-widget-wrapper {
    --shqc-primary: #2C5F5D;
    --shqc-primary-dark: #1a3938;
    --shqc-accent: #D4A574;
    --shqc-bg: #F4F1ED;
    --shqc-card-bg: #FFFFFF;
    --shqc-text: #2A2A2A;
    --shqc-text-light: #6B6B6B;
    --shqc-border: #E8E6E1;
    --shqc-success: #4A7C59;
    --shqc-warning: #D4A574;
    --shqc-danger: #C74C4C;
    font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #F4F1ED !important;
    color: #2A2A2A !important;
    padding: 1rem;
    max-width: 720px;
    margin: 0 auto;
    box-sizing: border-box;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
}

.shqc-widget-wrapper * { box-sizing: border-box; }

.shqc-container { width: 100%; position: relative; }

.shqc-header {
    text-align: center;
    margin-bottom: 0.75rem;
    opacity: 1;
    animation: shqc-fadeInDown 0.8s ease forwards;
}

@keyframes shqc-fadeInDown {
    from { opacity: 0; transform: translateY(-30px); }
    to { opacity: 1; transform: translateY(0); }
}

.shqc-header h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 2rem;
    color: var(--shqc-primary) !important;
    margin-bottom: 0.25rem;
    font-weight: 700;
}

.shqc-header p { color: var(--shqc-text-light) !important; font-size: 0.9rem; font-weight: 300; }

.shqc-progress-bar {
    height: 3px;
    background: var(--shqc-border);
    border-radius: 10px;
    margin-bottom: 0.75rem;
    overflow: hidden;
}

.shqc-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--shqc-primary) 0%, var(--shqc-accent) 100%);
    width: 0%;
    transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    border-radius: 10px;
}

.shqc-quiz-card {
    background: var(--shqc-card-bg);
    border-radius: 16px;
    padding: 1.5rem;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08), 0 2px 8px rgba(0, 0, 0, 0.04);
    border: 1px solid var(--shqc-border);
    position: relative;
    overflow: hidden;
    min-height: 400px;
    touch-action: manipulation;
    /* Force own compositor layer so iOS Safari paints content on first load (avoids blank until tap) */
    -webkit-transform: translateZ(0);
    transform: translateZ(0);
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
}

.shqc-quiz-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--shqc-primary) 0%, var(--shqc-accent) 100%);
}

.shqc-question-container { position: relative; min-height: 350px; overflow: hidden; }

.shqc-question {
    opacity: 0;
    transform: translateX(100px);
    position: absolute;
    width: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    min-height: 350px;
}

.shqc-question.active {
    opacity: 1;
    transform: translateX(0);
    position: relative;
    pointer-events: auto;
    animation: shqc-slideIn 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    min-height: 350px;
}

.shqc-question.exit { animation: shqc-slideOut 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; }

@keyframes shqc-slideIn {
    from { opacity: 0; transform: translateX(100px); }
    to { opacity: 1; transform: translateX(0); }
}

@keyframes shqc-slideOut {
    from { opacity: 1; transform: translateX(0); }
    to { opacity: 0; transform: translateX(-100px); }
}

.shqc-question-number {
    font-size: 0.75rem;
    color: var(--shqc-accent);
    font-weight: 600;
    margin-bottom: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.shqc-question-text {
    font-size: 1.3rem;
    color: var(--shqc-text) !important;
    margin-bottom: 1.25rem;
    font-weight: 500;
    line-height: 1.3;
}

.shqc-answers { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1.25rem; }

.shqc-answer {
    background: var(--shqc-bg);
    border: 2px solid var(--shqc-border);
    border-radius: 12px;
    padding: 0.875rem 1.25rem;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
    opacity: 0;
    transform: translateY(20px);
}

.shqc-question.active .shqc-answer { animation: shqc-fadeInUp 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
.shqc-question.active .shqc-answer:nth-child(1) { animation-delay: 0.1s; }
.shqc-question.active .shqc-answer:nth-child(2) { animation-delay: 0.15s; }
.shqc-question.active .shqc-answer:nth-child(3) { animation-delay: 0.2s; }
.shqc-question.active .shqc-answer:nth-child(4) { animation-delay: 0.25s; }

@keyframes shqc-fadeInUp {
    to { opacity: 1; transform: translateY(0); }
}

.shqc-answer:hover {
    transform: translateX(8px);
    border-color: var(--shqc-accent);
    background: #FFFFFF;
    box-shadow: 0 8px 24px rgba(44, 95, 93, 0.12);
}

.shqc-answer.selected {
    border-color: var(--shqc-primary);
    background: linear-gradient(135deg, rgba(44, 95, 93, 0.05) 0%, rgba(212, 165, 116, 0.05) 100%);
    transform: translateX(8px);
}

.shqc-answer-text { font-size: 0.95rem; color: var(--shqc-text) !important; line-height: 1.4; }

.shqc-navigation { margin-top: 1.25rem; display: flex; gap: 0.75rem; justify-content: space-between; }

/* Buttons */
.shqc-widget-wrapper .shqc-btn,
.shqc-widget-wrapper button.shqc-btn {
    padding: 0.75rem 1.5rem !important;
    border-radius: 10px !important;
    font-size: 0.9rem !important;
    font-weight: 500 !important;
    font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
    cursor: pointer !important;
    border: none !important;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
    background: none !important;
    color: inherit !important;
    line-height: 1.5 !important;
    text-align: center !important;
    text-decoration: none !important;
    display: inline-block !important;
    box-sizing: border-box !important;
    margin: 0 !important;
}

.shqc-widget-wrapper .shqc-btn-secondary,
.shqc-widget-wrapper button.shqc-btn-secondary {
    background: transparent !important;
    color: var(--shqc-text-light) !important;
    border: 2px solid var(--shqc-border) !important;
}

.shqc-widget-wrapper .shqc-btn-secondary:hover {
    border-color: var(--shqc-primary) !important;
    color: var(--shqc-primary) !important;
    transform: translateY(-2px) !important;
}

.shqc-widget-wrapper .shqc-btn-primary,
.shqc-widget-wrapper button.shqc-btn-primary {
    background: linear-gradient(135deg, var(--shqc-primary) 0%, var(--shqc-primary-dark) 100%) !important;
    color: #FFFFFF !important;
    box-shadow: 0 4px 16px rgba(44, 95, 93, 0.2) !important;
    border: none !important;
}

.shqc-widget-wrapper .shqc-btn-primary:hover { transform: translateY(-2px) !important; box-shadow: 0 8px 24px rgba(44, 95, 93, 0.3) !important; }
.shqc-widget-wrapper .shqc-btn-primary:disabled { opacity: 0.5 !important; cursor: not-allowed !important; transform: none !important; }

/* Consent form (after quiz) */
.shqc-consent-form { display: none; min-height: 350px; }
.shqc-consent-form.active { display: block; animation: shqc-scaleIn 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards; min-height: 350px; }

.shqc-consent-form-container { text-align: center; }
.shqc-consent-form h2 { font-family: 'Playfair Display', Georgia, serif; font-size: 1.5rem; color: var(--shqc-primary); margin-bottom: 0.5rem; }
.shqc-consent-form p { color: var(--shqc-text-light); font-size: 0.9rem; margin-bottom: 1rem; }

.shqc-consent-input-group { margin-bottom: 1rem; text-align: left; }
.shqc-consent-input-group label { display: block; font-weight: 500; color: var(--shqc-text); margin-bottom: 0.4rem; font-size: 0.85rem; }
.shqc-consent-input-group input {
    width: 100%;
    padding: 0.75rem 1rem;
    border: 2px solid var(--shqc-border);
    border-radius: 10px;
    font-size: 0.9rem;
    font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--shqc-bg);
}
.shqc-consent-input-group input:focus { outline: none; border-color: var(--shqc-primary); background: white; }
.shqc-consent-input-group input.error { border-color: var(--shqc-danger); }

.shqc-consent-checkboxes { margin: 1rem 0; text-align: left; }
.shqc-consent-checkbox {
    display: flex;
    align-items: flex-start;
    gap: 0.5rem;
    margin-bottom: 0.75rem;
    cursor: pointer;
}
.shqc-consent-checkbox input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--shqc-primary); cursor: pointer; flex-shrink: 0; }
.shqc-consent-checkbox label { font-size: 0.9rem; color: var(--shqc-text); line-height: 1.4; cursor: pointer; margin: 0; }
.shqc-consent-checkbox span { font-size: 0.9rem; color: var(--shqc-text); line-height: 1.4; }

.shqc-consent-actions { display: flex; flex-direction: column; gap: 0.75rem; margin-top: 1.25rem; }
.shqc-consent-actions .shqc-btn-primary { width: 100%; }
.shqc-consent-actions .shqc-btn-skip {
    background: transparent !important;
    border: 2px solid var(--shqc-border) !important;
    color: var(--shqc-text-light) !important;
}
.shqc-consent-actions .shqc-btn-skip:hover { border-color: var(--shqc-primary) !important; color: var(--shqc-primary) !important; }

.shqc-error-message { color: var(--shqc-danger); font-size: 0.9rem; margin-top: 0.5rem; display: none; }
.shqc-error-message.show { display: block; }

.shqc-loading-overlay {
    display: none;
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(255, 255, 255, 0.95);
    border-radius: 16px;
    align-items: center;
    justify-content: center;
    z-index: 100;
    flex-direction: column;
}
.shqc-loading-overlay.active { display: flex; animation: shqc-fadeIn 0.3s ease forwards; }
@keyframes shqc-fadeIn { from { opacity: 0; } to { opacity: 1; } }

.shqc-spinner {
    width: 50px; height: 50px;
    border: 4px solid var(--shqc-border);
    border-top-color: var(--shqc-primary);
    border-radius: 50%;
    animation: shqc-spin 0.8s linear infinite;
    margin-bottom: 1rem;
}
@keyframes shqc-spin { to { transform: rotate(360deg); } }
.shqc-loading-text { color: var(--shqc-text); font-size: 1rem; font-weight: 500; }

.shqc-success-message { display: none; padding: 1rem; background: rgba(74, 124, 89, 0.1); border: 2px solid var(--shqc-success); border-radius: 12px; color: var(--shqc-success); margin-bottom: 1rem; font-weight: 500; }
.shqc-success-message.show { display: block; animation: shqc-fadeIn 0.5s ease forwards; }

/* Results */
.shqc-results { display: none; text-align: center; padding: 0.5rem; min-height: 350px; }
.shqc-results.active { display: block; animation: shqc-scaleIn 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards; min-height: 350px; }
@keyframes shqc-scaleIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

.shqc-score-circle {
    width: 100px; height: 100px;
    margin: 0 auto 0.75rem;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 2rem; font-weight: 700;
    font-family: 'Playfair Display', Georgia, serif;
    position: relative;
    background: linear-gradient(135deg, var(--shqc-bg) 0%, #FFFFFF 100%);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1), inset 0 2px 8px rgba(255, 255, 255, 0.8);
}
.shqc-score-circle::before {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--shqc-primary) 0%, var(--shqc-accent) 100%);
    z-index: -1;
    animation: shqc-rotate 3s linear infinite;
}
@keyframes shqc-rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

.shqc-results h2 { font-family: 'Playfair Display', Georgia, serif; font-size: 1.25rem; color: var(--shqc-primary); margin-bottom: 0.5rem; }
.shqc-results-description { font-size: 0.85rem; color: var(--shqc-text-light); line-height: 1.4; margin-bottom: 0.75rem; }

.shqc-severity-badge { display: inline-block; padding: 0.4rem 0.875rem; border-radius: 50px; font-weight: 600; font-size: 0.8rem; margin-bottom: 0.75rem; }
.shqc-severity-low { background: rgba(74, 124, 89, 0.1); color: var(--shqc-success); }
.shqc-severity-moderate { background: rgba(212, 165, 116, 0.1); color: var(--shqc-warning); }
.shqc-severity-high { background: rgba(199, 76, 76, 0.1); color: var(--shqc-danger); }

/* Results CTA: Book appointment (reveals form) + Free call link */
.shqc-results-cta { margin-top: 1.5rem; }
.shqc-results-cta .shqc-btn-book {
    display: inline-block;
    padding: 0.75rem 2rem;
    background: linear-gradient(135deg, var(--shqc-primary) 0%, var(--shqc-primary-dark) 100%);
    color: #FFFFFF;
    border: none;
    border-radius: 10px;
    font-weight: 600;
    font-size: 0.9rem;
    font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-bottom: 0.5rem;
}
.shqc-results-cta .shqc-btn-book:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(44, 95, 93, 0.3); }

.shqc-results-cta .shqc-free-call {
    display: block;
    font-size: 0.9rem;
    color: var(--shqc-primary);
    text-decoration: none;
    margin-top: 0.5rem;
}
.shqc-results-cta .shqc-free-call:hover { text-decoration: underline; }

/* In-page booking form (shown when "Book appointment" clicked) */
.shqc-booking-form-wrap { display: none; margin-top: 1.25rem; padding: 1.25rem; background: var(--shqc-bg); border-radius: 12px; border: 1px solid var(--shqc-border); text-align: left; }
.shqc-booking-form-wrap.active { display: block; animation: shqc-fadeIn 0.3s ease forwards; }
.shqc-booking-form-wrap h3 { font-size: 1rem; color: var(--shqc-primary); margin-bottom: 0.75rem; }
.shqc-booking-form-wrap .shqc-consent-input-group { margin-bottom: 0.75rem; }
.shqc-booking-form-wrap .shqc-consent-input-group input { font-size: 0.9rem; padding: 0.6rem 0.75rem; }
.shqc-booking-form-wrap .shqc-consent-input-group textarea {
    width: 100%;
    padding: 0.6rem 0.75rem;
    border: 2px solid var(--shqc-border);
    border-radius: 10px;
    font-size: 0.9rem;
    font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--shqc-bg);
    resize: vertical;
    min-height: 80px;
}
.shqc-booking-form-wrap .shqc-consent-input-group textarea:focus { outline: none; border-color: var(--shqc-primary); background: white; }
.shqc-booking-form-wrap .shqc-btn-primary { width: 100%; margin-top: 0.5rem; }

@media (max-width: 640px) {
    .shqc-widget-wrapper { padding: 0.5rem; }
    .shqc-header h1 { font-size: 1.5rem; }
    .shqc-quiz-card { padding: 1rem; min-height: 350px; }
    .shqc-question-container { min-height: 300px; }
    .shqc-question, .shqc-question.active { min-height: 300px; }
    .shqc-question-text { font-size: 1.1rem; }
    .shqc-answer { padding: 0.75rem 1rem; }
    .shqc-answer-text { font-size: 0.85rem; }
    .shqc-score-circle { width: 80px; height: 80px; font-size: 2rem; }
    .shqc-results h2 { font-size: 1.1rem; }
}
</style>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">

<div class="shqc-widget-wrapper">
    <div class="shqc-container">
        <div class="shqc-header">
            <h1>Spinal Health Assessment</h1>
            <p>Discover your spinal health status in 10 questions</p>
        </div>
        <div class="shqc-progress-bar">
            <div class="shqc-progress-fill" id="shqc-progressFill"></div>
        </div>
        <div class="shqc-quiz-card">
            <div class="shqc-loading-overlay" id="shqc-loadingOverlay">
                <div class="shqc-spinner"></div>
                <div class="shqc-loading-text">Submitting...</div>
            </div>
            <div id="shqc-quizContainer" class="shqc-question-container">
                <!-- Prerendered first question so iOS paints quiz text on first load -->
                <div class="shqc-question active">
                    <div class="shqc-question-number">Question 1 of 10</div>
                    <h2 class="shqc-question-text">How often do you have back or neck pain?</h2>
                    <div class="shqc-answers">
                        <div class="shqc-answer" data-value="3"><div class="shqc-answer-text">Rarely or never</div></div>
                        <div class="shqc-answer" data-value="2"><div class="shqc-answer-text">A few days a month</div></div>
                        <div class="shqc-answer" data-value="1"><div class="shqc-answer-text">Most days of the week</div></div>
                        <div class="shqc-answer" data-value="0"><div class="shqc-answer-text">Daily or almost always</div></div>
                    </div>
                    <div class="shqc-navigation">
                        <button type="button" class="shqc-btn shqc-btn-secondary" id="shqc-prevBtn" style="visibility: hidden">Previous</button>
                        <button type="button" class="shqc-btn shqc-btn-primary" id="shqc-nextBtn" disabled>Next Question</button>
                    </div>
                </div>
            </div>
            <div id="shqc-consentForm" class="shqc-consent-form"></div>
            <div id="shqc-resultsContainer" class="shqc-results"></div>
        </div>
    </div>
</div>

<script>
(function() {
    const SHQC_API = 'https://spinal-health-quiz.pages.dev/api/submit';

    const shqcQuestions = [
        { question: "How often do you have back or neck pain?", answers: [ { text: "Rarely or never", value: 3 }, { text: "A few days a month", value: 2 }, { text: "Most days of the week", value: 1 }, { text: "Daily or almost always", value: 0 } ] },
        { question: "When your back or neck pain shows up, how much does it affect your day?", answers: [ { text: "I don't really get bad pain", value: 3 }, { text: "Mild, noticeable but easy to push through", value: 2 }, { text: "Moderate, it changes how I move or what I do that day", value: 1 }, { text: "Severe, it stops me or forces me to rest", value: 0 } ] },
        { question: "How does sitting affect you?", answers: [ { text: "No issues, I can sit as long as I need to", value: 3 }, { text: "Some discomfort after an hour or more", value: 2 }, { text: "Pain or stiffness starts around 30 minutes", value: 1 }, { text: "I can barely sit 10–15 minutes without pain", value: 0 } ] },
        { question: "How does standing or walking affect you? (errands, cooking, standing in line, events)", answers: [ { text: "No effect, I feel fine", value: 3 }, { text: "Slight discomfort after a long time", value: 2 }, { text: "Pain starts fairly quickly and slows me down", value: 1 }, { text: "I avoid it when I can", value: 0 } ] },
        { question: "How does your spine affect everyday physical tasks? (laundry, yardwork, groceries, cleaning)", answers: [ { text: "No limitation, I do these normally", value: 3 }, { text: "Some discomfort, but I get through it", value: 2 }, { text: "I have to pace myself, modify things, or ask for help", value: 1 }, { text: "I avoid most of these or rely on others", value: 0 } ] },
        { question: "Do you experience numbness, tingling, or weakness in your arms or legs?", answers: [ { text: "Never", value: 3 }, { text: "Rarely, and it passes quickly", value: 2 }, { text: "Occasionally, clearly noticeable when it happens", value: 1 }, { text: "Frequently or constantly, or it affects my strength or balance", value: 0 } ] },
        { question: "How does your spine affect your sleep?", answers: [ { text: "No problems", value: 3 }, { text: "Occasionally wakes me up or makes me reposition", value: 2 }, { text: "Frequently disrupts sleep or makes it hard to get comfortable", value: 1 }, { text: "Most nights are affected and sleep quality is poor", value: 0 } ] },
        { question: "How does your spine affect hobbies, exercise, or plans with people?", answers: [ { text: "Not at all, I do what I want", value: 3 }, { text: "I sometimes cut things short or modify them", value: 2 }, { text: "I often skip things I'd like to do", value: 1 }, { text: "I've stopped doing certain things altogether", value: 0 } ] },
        { question: "If in active pain, how long have you been dealing with it?", answers: [ { text: "No pain", value: 3 }, { text: "Less than 6 weeks", value: 2 }, { text: "More than 6 weeks, but not really changing", value: 1 }, { text: "Several months or longer, same or getting worse", value: 0 } ] },
        { question: "In the past month, how often have you reached for pain relievers, a heating pad, or other remedies just to get through the day?", answers: [ { text: "Rarely or never, I don't need to", value: 3 }, { text: "Once in a while", value: 2 }, { text: "A few times a week", value: 1 }, { text: "Almost daily, it's become part of my routine", value: 0 } ] }
    ];

    let shqcCurrentQuestion = 0;
    let shqcAnswers = [];

    function shqcBindQuestionEvents(questionDiv, index) {
        const answerEls = questionDiv.querySelectorAll('.shqc-answer');
        answerEls.forEach(function(el) {
            el.addEventListener('click', function() {
                answerEls.forEach(function(a) { a.classList.remove('selected'); });
                el.classList.add('selected');
                shqcAnswers[index] = parseInt(el.dataset.value, 10);
                document.getElementById('shqc-nextBtn').disabled = false;
            });
        });
        if (shqcAnswers[index] !== undefined) {
            var sel = questionDiv.querySelector('[data-value="' + shqcAnswers[index] + '"]');
            if (sel) { sel.classList.add('selected'); document.getElementById('shqc-nextBtn').disabled = false; }
        }
        document.getElementById('shqc-nextBtn').addEventListener('click', shqcNextQuestion);
        if (index > 0) document.getElementById('shqc-prevBtn').addEventListener('click', shqcPreviousQuestion);
    }

    function shqcRenderQuestion(index) {
        const container = document.getElementById('shqc-quizContainer');
        const q = shqcQuestions[index];
        const questionDiv = document.createElement('div');
        questionDiv.className = 'shqc-question';
        questionDiv.innerHTML = `
            <div class="shqc-question-number">Question ${index + 1} of ${shqcQuestions.length}</div>
            <h2 class="shqc-question-text">${q.question}</h2>
            <div class="shqc-answers">
                ${q.answers.map(a => `<div class="shqc-answer" data-value="${a.value}"><div class="shqc-answer-text">${a.text}</div></div>`).join('')}
            </div>
            <div class="shqc-navigation">
                <button type="button" class="shqc-btn shqc-btn-secondary" id="shqc-prevBtn" ${index === 0 ? 'style="visibility: hidden"' : ''}>Previous</button>
                <button type="button" class="shqc-btn shqc-btn-primary" id="shqc-nextBtn" disabled>${index === shqcQuestions.length - 1 ? 'See Results' : 'Next Question'}</button>
            </div>`;
        /* Add .active before appendChild so first paint on mobile shows content (avoids empty white box until tap) */
        questionDiv.classList.add('active');
        container.appendChild(questionDiv);

        /* iOS Safari: force reflow + repaint so quiz content shows without a tap */
        if (index === 0) {
            void container.offsetHeight;
            requestAnimationFrame(function() {
                questionDiv.style.opacity = '1';
            });
        }

        shqcBindQuestionEvents(questionDiv, index);
        shqcUpdateProgress();
    }

    function shqcNextQuestion() {
        const current = document.querySelector('.shqc-question.active');
        current.classList.remove('active');
        current.classList.add('exit');
        setTimeout(function() {
            current.remove();
            shqcCurrentQuestion++;
            if (shqcCurrentQuestion < shqcQuestions.length) shqcRenderQuestion(shqcCurrentQuestion);
            else shqcShowConsentForm();
        }, 500);
    }

    function shqcPreviousQuestion() {
        const current = document.querySelector('.shqc-question.active');
        current.classList.remove('active');
        current.classList.add('exit');
        setTimeout(function() {
            current.remove();
            shqcCurrentQuestion--;
            shqcRenderQuestion(shqcCurrentQuestion);
        }, 500);
    }

    function shqcUpdateProgress() {
        document.getElementById('shqc-progressFill').style.width = ((shqcCurrentQuestion + 1) / shqcQuestions.length) * 100 + '%';
    }

    function shqcShowConsentForm() {
        document.getElementById('shqc-quizContainer').style.display = 'none';
        const formEl = document.getElementById('shqc-consentForm');
        formEl.innerHTML = `
            <div class="shqc-consent-form-container">
                <h2>Get Your Results</h2>
                <p>Optionally share your info to receive your assessment and helpful follow-up.</p>
                <div class="shqc-consent-input-group">
                    <label for="shqc-nameInput">Full Name <span style="color: var(--shqc-text-light); font-weight: normal;">(required if submitting)</span></label>
                    <input type="text" id="shqc-nameInput" placeholder="John Doe" autocomplete="name" />
                    <div class="shqc-error-message" id="shqc-nameError">Please enter your name</div>
                </div>
                <div class="shqc-consent-input-group">
                    <label for="shqc-emailInput">Email <span style="color: var(--shqc-text-light); font-weight: normal;">(required if submitting)</span></label>
                    <input type="email" id="shqc-emailInput" placeholder="your.email@example.com" autocomplete="email" />
                    <div class="shqc-error-message" id="shqc-emailError">Please enter a valid email</div>
                </div>
                <div class="shqc-consent-input-group">
                    <label for="shqc-phoneInput">Phone <span style="color: var(--shqc-text-light); font-weight: normal;">(optional)</span></label>
                    <input type="tel" id="shqc-phoneInput" placeholder="(555) 123-4567" autocomplete="tel" />
                    <div class="shqc-error-message" id="shqc-phoneError">Please enter a valid 10-digit phone number</div>
                </div>
                <div class="shqc-consent-checkboxes">
                    <label class="shqc-consent-checkbox">
                        <input type="checkbox" id="shqc-consentEmails" checked />
                        <span>Send me helpful emails about spinal health</span>
                    </label>
                    <label class="shqc-consent-checkbox">
                        <input type="checkbox" id="shqc-consentSchedule" />
                        <span>I'd like to be scheduled for an appointment</span>
                    </label>
                </div>
                <div class="shqc-success-message" id="shqc-consentSuccess">Thanks! Taking you to your results.</div>
                <div class="shqc-consent-actions">
                    <button type="button" class="shqc-btn shqc-btn-primary" id="shqc-submitConsentBtn">Submit &amp; Get Results</button>
                    <button type="button" class="shqc-btn shqc-btn-skip" id="shqc-skipBtn">Skip and get results</button>
                </div>
            </div>`;
        formEl.classList.add('active');

        const nameInput = document.getElementById('shqc-nameInput');
        const emailInput = document.getElementById('shqc-emailInput');
        const phoneInput = document.getElementById('shqc-phoneInput');
        [nameInput, emailInput].forEach(function(inp) {
            inp.addEventListener('input', function() {
                inp.classList.remove('error');
                document.getElementById('shqc-' + (inp.id.replace('shqc-', '').replace('Input', '')) + 'Error').classList.remove('show');
            });
        });
        phoneInput.addEventListener('input', function(e) {
            phoneInput.classList.remove('error');
            document.getElementById('shqc-phoneError').classList.remove('show');
            let v = e.target.value.replace(/\D/g, '');
            if (v.length > 0) {
                if (v.length <= 3) v = '(' + v;
                else if (v.length <= 6) v = '(' + v.slice(0, 3) + ') ' + v.slice(3);
                else v = '(' + v.slice(0, 3) + ') ' + v.slice(3, 6) + '-' + v.slice(6, 10);
            }
            e.target.value = v;
        });

        document.getElementById('shqc-submitConsentBtn').addEventListener('click', shqcHandleConsentSubmit);
        document.getElementById('shqc-skipBtn').addEventListener('click', function() {
            document.getElementById('shqc-consentForm').classList.remove('active');
            shqcShowResults();
        });
    }

    function shqcValidateEmail(email) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email); }
    function shqcValidatePhone(phone) {
        if (!phone || !phone.trim()) return true;
        return phone.replace(/\D/g, '').length === 10;
    }

    async function shqcHandleConsentSubmit() {
        const nameInput = document.getElementById('shqc-nameInput');
        const emailInput = document.getElementById('shqc-emailInput');
        const phoneInput = document.getElementById('shqc-phoneInput');
        const name = nameInput.value.trim();
        const email = emailInput.value.trim();
        const phone = phoneInput.value.trim();
        const consentEmails = document.getElementById('shqc-consentEmails').checked;
        const consentSchedule = document.getElementById('shqc-consentSchedule').checked;

        if (!name || name.length < 2) {
            nameInput.classList.add('error');
            document.getElementById('shqc-nameError').classList.add('show');
            return;
        }
        if (!email || !shqcValidateEmail(email)) {
            emailInput.classList.add('error');
            document.getElementById('shqc-emailError').classList.add('show');
            return;
        }
        if (phone && !shqcValidatePhone(phone)) {
            phoneInput.classList.add('error');
            document.getElementById('shqc-phoneError').classList.add('show');
            return;
        }

        const btn = document.getElementById('shqc-submitConsentBtn');
        btn.disabled = true;
        document.getElementById('shqc-loadingOverlay').classList.add('active');

        try {
            await fetch(SHQC_API, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: name,
                    email: email,
                    phone: phone || '',
                    answers: shqcAnswers,
                    questions: shqcQuestions,
                    consent_emails: consentEmails,
                    consent_schedule: consentSchedule,
                    newsletter: consentEmails,
                    schedule_me: consentSchedule
                })
            });
        } catch (e) { console.warn('Submit error:', e); }

        document.getElementById('shqc-loadingOverlay').classList.remove('active');
        document.getElementById('shqc-consentSuccess').classList.add('show');
        document.getElementById('shqc-consentForm').classList.remove('active');
        setTimeout(shqcShowResults, 600);
    }

    function shqcShowResults() {
        const totalScore = shqcAnswers.reduce(function(s, v) { return s + v; }, 0);
        const maxScore = shqcQuestions.length * 3;
        const percentage = Math.round((totalScore / maxScore) * 100);

        let grade, severityClass, description;
        if (percentage >= 90) {
            grade = "Grade A";
            severityClass = "shqc-severity-low";
            description = "Your spine isn't slowing you down, and that's a great place to be. Most people wait until something hurts before they start thinking about their spinal health, but you're already ahead of the curve. Staying active, maintaining good nutrition, and prioritizing good sleep get you most of the way. We actually love seeing asymptomatic people in our office because a simple proactive tune-up every now and then can help keep small issues from turning into bigger ones. Think of it as maintenance for the one spine you have.";
        } else if (percentage >= 75) {
            grade = "Grade B";
            severityClass = "shqc-severity-moderate";
            description = "It's not debilitating, but it's not nothing either. Recurring stiffness, pain, and reductions in range of motion are early signals that are worth paying attention to. Most people in this range do really well with a focused treatment plan: A thorough exam, targeted adjustments, and habits that support your care. The earlier you address it, the easier it is to turn around.";
        } else if (percentage >= 50) {
            grade = "Grade C";
            severityClass = "shqc-severity-moderate";
            description = "Your results show your spine is regularly getting in the way of work, sleep, activities, or just feeling like yourself. That's not something to push through and hope resolves. A focused evaluation will show you exactly what's driving it and what a realistic path forward looks like. Most people leave that first visit with more clarity and less anxiety than they came in with.";
        } else {
            grade = "Grade F";
            severityClass = "shqc-severity-high";
            description = "At this level, your spine is affecting nearly every part of daily life. That doesn't mean something catastrophic is happening, but it does mean you shouldn't have to live this way without answers. You're not alone, though. We see people with symptoms like this all the time, and many are relieved to learn that the cause is more manageable than they feared. A thorough exam is the first step toward understanding what's going on and building a plan that actually helps. Let's figure out what's driving this and what your options are.";
        }

        const resultsHTML = `
            <div class="shqc-score-circle">${percentage}<span style="font-size: 1.25rem;">%</span></div>
            <div class="shqc-severity-badge ${severityClass}">${grade}</div>
            <p class="shqc-results-description">${description}</p>
            <div class="shqc-results-cta">
                <button type="button" class="shqc-btn-book" id="shqc-bookBtn">Book appointment</button>
                <div class="shqc-booking-form-wrap" id="shqc-bookingFormWrap">
                    <h3>Request an appointment</h3>
                    <div class="shqc-consent-input-group">
                        <label for="shqc-bookName">Name <span style="color: var(--shqc-text-light); font-weight: normal;">(required)</span></label>
                        <input type="text" id="shqc-bookName" placeholder="Your name" autocomplete="name" />
                    </div>
                    <div class="shqc-consent-input-group">
                        <label for="shqc-bookEmail">Email <span style="color: var(--shqc-text-light); font-weight: normal;">(required)</span></label>
                        <input type="email" id="shqc-bookEmail" placeholder="your@email.com" autocomplete="email" />
                    </div>
                    <div class="shqc-consent-input-group">
                        <label for="shqc-bookPhone">Phone <span style="color: var(--shqc-text-light); font-weight: normal;">(required)</span></label>
                        <input type="tel" id="shqc-bookPhone" placeholder="(555) 123-4567" autocomplete="tel" />
                        <div class="shqc-error-message" id="shqc-bookPhoneError">Please enter a valid 10-digit phone number</div>
                    </div>
                    <div class="shqc-consent-input-group">
                        <label for="shqc-bookNote">Notes to the doctor <span style="color: var(--shqc-text-light); font-weight: normal;">(optional)</span></label>
                        <textarea id="shqc-bookNote" placeholder="Anything you'd like the doctor to know before your appointment..." rows="3"></textarea>
                    </div>
                    <div class="shqc-error-message" id="shqc-bookError"></div>
                    <div class="shqc-success-message" id="shqc-bookSuccess" style="margin-top: 0.5rem;">We'll be in touch to schedule.</div>
                    <button type="button" class="shqc-btn shqc-btn-primary" id="shqc-bookSubmitBtn">Submit</button>
                </div>
                <a href="https://tidycal.com/jeremiahcox98/15-minute-consult" target="_blank" rel="noopener" class="shqc-free-call">or Free 15 min call with Dr. Cox</a>
            </div>`;

        const resultsContainer = document.getElementById('shqc-resultsContainer');
        resultsContainer.innerHTML = resultsHTML;
        resultsContainer.classList.add('active');
        document.getElementById('shqc-quizContainer').style.display = 'none';

        document.getElementById('shqc-bookBtn').addEventListener('click', function() {
            document.getElementById('shqc-bookingFormWrap').classList.toggle('active');
        });

        var bookPhoneInput = document.getElementById('shqc-bookPhone');
        bookPhoneInput.addEventListener('input', function(e) {
            bookPhoneInput.classList.remove('error');
            var phoneErr = document.getElementById('shqc-bookPhoneError');
            if (phoneErr) phoneErr.classList.remove('show');
            var v = e.target.value.replace(/\D/g, '');
            if (v.length > 0) {
                if (v.length <= 3) v = '(' + v;
                else if (v.length <= 6) v = '(' + v.slice(0, 3) + ') ' + v.slice(3);
                else v = '(' + v.slice(0, 3) + ') ' + v.slice(3, 6) + '-' + v.slice(6, 10);
            }
            e.target.value = v;
        });
        bookPhoneInput.addEventListener('keydown', function(e) {
            if (e.key === 'Backspace' && e.target.value.length === 5) {
                e.target.value = e.target.value.slice(1, -1);
            }
        });

        document.getElementById('shqc-bookSubmitBtn').addEventListener('click', function() {
            const bName = document.getElementById('shqc-bookName').value.trim();
            const bEmail = document.getElementById('shqc-bookEmail').value.trim();
            const bPhone = document.getElementById('shqc-bookPhone').value.trim();
            const bNote = document.getElementById('shqc-bookNote').value.trim();
            const bookError = document.getElementById('shqc-bookError');
            const bookSuccess = document.getElementById('shqc-bookSuccess');
            const bookPhoneError = document.getElementById('shqc-bookPhoneError');
            bookError.classList.remove('show');
            if (bookPhoneError) bookPhoneError.classList.remove('show');
            bookSuccess.classList.remove('show');
            if (!bName || !bEmail) {
                bookError.textContent = 'Please enter your name, email, and phone.';
                bookError.classList.add('show');
                return;
            }
            if (!bPhone) {
                bookError.textContent = 'Please enter your phone number.';
                bookError.classList.add('show');
                return;
            }
            if (!shqcValidatePhone(bPhone)) {
                document.getElementById('shqc-bookPhone').classList.add('error');
                if (bookPhoneError) {
                    bookPhoneError.textContent = 'Please enter a valid 10-digit phone number.';
                    bookPhoneError.classList.add('show');
                }
                return;
            }
            if (!shqcValidateEmail(bEmail)) {
                bookError.textContent = 'Please enter a valid email address.';
                bookError.classList.add('show');
                return;
            }
            document.getElementById('shqc-bookSubmitBtn').disabled = true;
            fetch(SHQC_API, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: bName,
                    email: bEmail,
                    phone: bPhone || '',
                    note: bNote || '',
                    answers: shqcAnswers,
                    questions: shqcQuestions,
                    intent: 'book_appointment'
                })
            }).then(function() {
                bookSuccess.classList.add('show');
            }).catch(function() {
                bookError.textContent = 'Something went wrong. Please try again.';
                bookError.classList.add('show');
                document.getElementById('shqc-bookSubmitBtn').disabled = false;
            });
        });
    }

    function shqcInit() {
        var container = document.getElementById('shqc-quizContainer');
        var existingQuestion = container && container.querySelector('.shqc-question');
        if (existingQuestion) {
            shqcCurrentQuestion = 0;
            shqcBindQuestionEvents(existingQuestion, 0);
            shqcUpdateProgress();
        } else {
            shqcRenderQuestion(0);
        }
    }
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', shqcInit);
    } else {
        shqcInit();
    }

    setTimeout(function() {
        var c = document.getElementById('shqc-quizContainer');
        if (c && c.children.length === 0) c.innerHTML = '<p style="color: var(--shqc-text); padding: 2rem; text-align: center;">Loading quiz... If this persists, refresh the page.</p>';
    }, 1000);
})();
</script>
