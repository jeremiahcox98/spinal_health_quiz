<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spinal Health Assessment</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2C5F5D;
            --primary-dark: #1a3938;
            --accent: #D4A574;
            --bg: #F4F1ED;
            --card-bg: #FFFFFF;
            --text: #2A2A2A;
            --text-light: #6B6B6B;
            --border: #E8E6E1;
            --success: #4A7C59;
            --warning: #D4A574;
            --danger: #C74C4C;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: #F4F1ED;
            color: var(--text);
            height: 100vh;
            max-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem;
            position: relative;
            overflow: hidden;
            margin: 0;
        }

        body::before,
        body::after {
            display: none;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -30px) rotate(5deg); }
            66% { transform: translate(-20px, 20px) rotate(-5deg); }
        }

        .container {
            max-width: 720px;
            width: 100%;
            position: relative;
            z-index: 1;
            height: 100%;
            max-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
        }

        .header {
            text-align: center;
            margin-bottom: 0.75rem;
            opacity: 0;
            animation: fadeInDown 0.8s ease forwards;
            flex-shrink: 0;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 0.25rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header p {
            color: var(--text-light);
            font-size: 0.9rem;
            font-weight: 300;
        }

        .progress-bar {
            height: 3px;
            background: var(--border);
            border-radius: 10px;
            margin-bottom: 0.75rem;
            overflow: hidden;
            opacity: 0;
            animation: fadeIn 0.8s ease 0.2s forwards;
            flex-shrink: 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary) 0%, var(--accent) 100%);
            width: 0%;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 10px;
        }

        .quiz-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.08),
                0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            min-height: 0;
            max-height: calc(100vh - 6rem);
        }

        .quiz-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary) 0%, var(--accent) 100%);
        }

        .question-container {
            flex: 1 1 auto;
            position: relative;
            min-height: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .question {
            opacity: 0;
            transform: translateX(100px);
            position: absolute;
            width: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }

        .question.active {
            opacity: 1;
            transform: translateX(0);
            position: relative;
            pointer-events: auto;
            animation: slideIn 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }

        .question.exit {
            animation: slideOut 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideOut {
            from {
                opacity: 1;
                transform: translateX(0);
            }
            to {
                opacity: 0;
                transform: translateX(-100px);
            }
        }

        .question-number {
            font-size: 0.75rem;
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .question-text {
            font-size: 1.3rem;
            color: var(--text);
            margin-bottom: 1.25rem;
            font-weight: 500;
            line-height: 1.3;
        }

        .answers {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            flex: 1 1 auto;
            overflow-y: auto;
            min-height: 0;
        }

        .answer {
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 0.875rem 1.25rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: translateY(20px);
        }

        .answer::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--accent);
            transform: scaleY(0);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: bottom;
        }

        .question.active .answer {
            animation: fadeInUp 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .question.active .answer:nth-child(1) { animation-delay: 0.1s; }
        .question.active .answer:nth-child(2) { animation-delay: 0.15s; }
        .question.active .answer:nth-child(3) { animation-delay: 0.2s; }
        .question.active .answer:nth-child(4) { animation-delay: 0.25s; }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .answer:hover {
            transform: translateX(8px);
            border-color: var(--accent);
            background: #FFFFFF;
            box-shadow: 0 8px 24px rgba(44, 95, 93, 0.12);
        }

        .answer:hover::before {
            transform: scaleY(1);
            transform-origin: top;
        }

        .answer.selected {
            border-color: var(--primary);
            background: linear-gradient(135deg, rgba(44, 95, 93, 0.05) 0%, rgba(212, 165, 116, 0.05) 100%);
            transform: translateX(8px);
        }

        .answer.selected::before {
            transform: scaleY(1);
            background: var(--primary);
        }

        .answer-text {
            font-size: 0.95rem;
            color: var(--text);
            font-weight: 400;
            line-height: 1.4;
        }

        .navigation {
            margin-top: 1.25rem;
            display: flex;
            gap: 0.75rem;
            justify-content: space-between;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: 'Outfit', sans-serif;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:active::before {
            width: 300px;
            height: 300px;
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-light);
            border: 2px solid var(--border);
        }

        .btn-secondary:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            box-shadow: 0 4px 16px rgba(44, 95, 93, 0.2);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(44, 95, 93, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .results {
            display: none;
            text-align: center;
            opacity: 0;
            height: 100%;
            max-height: 560px;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 0.5rem;
        }

        .results.active {
            display: flex;
            flex-direction: column;
            animation: scaleIn 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            min-height: 0;
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .score-circle {
            width: 100px;
            height: 100px;
            margin: 0 auto 0.75rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 700;
            font-family: 'Playfair Display', serif;
            position: relative;
            background: linear-gradient(135deg, var(--bg) 0%, #FFFFFF 100%);
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.1),
                inset 0 2px 8px rgba(255, 255, 255, 0.8);
            flex-shrink: 0;
        }

        .score-circle::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            z-index: -1;
            animation: rotate 3s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .results h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.25rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
            flex-shrink: 0;
        }

        .results-description {
            font-size: 0.85rem;
            color: var(--text-light);
            line-height: 1.4;
            margin-bottom: 0.75rem;
            max-width: 100%;
            margin-left: auto;
            margin-right: auto;
        }

        .severity-badge {
            display: inline-block;
            padding: 0.4rem 0.875rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.8rem;
            margin-bottom: 0.75rem;
            flex-shrink: 0;
        }

        .severity-low {
            background: rgba(74, 124, 89, 0.1);
            color: var(--success);
        }

        .severity-moderate {
            background: rgba(212, 165, 116, 0.1);
            color: var(--warning);
        }

        .severity-high {
            background: rgba(199, 76, 76, 0.1);
            color: var(--danger);
        }

        .cta-buttons {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-top: auto;
            padding-top: 1rem;
            flex-shrink: 0;
        }

        .cta-button {
            display: inline-block;
            padding: 0.75rem 2rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: 0 8px 24px rgba(44, 95, 93, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(44, 95, 93, 0.4);
        }

        .cta-button-secondary {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            box-shadow: none;
            padding: 0.65rem 2rem;
            font-size: 0.85rem;
        }

        .cta-button-secondary:hover {
            background: rgba(44, 95, 93, 0.05);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(44, 95, 93, 0.15);
        }

        .email-form {
            display: none;
            opacity: 0;
        }

        .email-form.active {
            display: block;
            animation: scaleIn 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .email-form-container {
            text-align: center;
        }

        .email-form h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .email-form p {
            color: var(--text-light);
            font-size: 0.9rem;
            margin-bottom: 1.25rem;
        }

        .email-input-group {
            margin-bottom: 1rem;
            text-align: left;
        }

        .email-input-group label {
            display: block;
            font-weight: 500;
            color: var(--text);
            margin-bottom: 0.4rem;
            font-size: 0.85rem;
        }

        .email-input-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 0.9rem;
            font-family: 'Outfit', sans-serif;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: var(--bg);
        }

        .email-input-group input:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 4px 16px rgba(44, 95, 93, 0.1);
        }

        .email-input-group input.error {
            border-color: var(--danger);
        }

        .error-message {
            color: var(--danger);
            font-size: 0.9rem;
            margin-top: 0.5rem;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .loading-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            align-items: center;
            justify-content: center;
            z-index: 100;
            flex-direction: column;
        }

        .loading-overlay.active {
            display: flex;
            animation: fadeIn 0.3s ease forwards;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: var(--text);
            font-size: 1.1rem;
            font-weight: 500;
        }

        .success-message {
            display: none;
            padding: 1rem;
            background: rgba(74, 124, 89, 0.1);
            border: 2px solid var(--success);
            border-radius: 12px;
            color: var(--success);
            margin-bottom: 1.5rem;
            font-weight: 500;
        }

        .success-message.show {
            display: block;
            animation: fadeIn 0.5s ease forwards;
        }

        @media (max-width: 640px) {
            body {
                padding: 0.5rem;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .header p {
                font-size: 0.8rem;
            }

            .quiz-card {
                padding: 1rem;
            }

            .question-text {
                font-size: 1.1rem;
            }

            .answer {
                padding: 0.75rem 1rem;
            }

            .answer-text {
                font-size: 0.85rem;
            }

            .score-circle {
                width: 120px;
                height: 120px;
                font-size: 2.5rem;
            }

            .results h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Spinal Health Assessment</h1>
            <p>Discover your spinal health status in 10 questions</p>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="quiz-card">
            <div class="loading-overlay" id="loadingOverlay">
                <div class="spinner"></div>
                <div class="loading-text">Submitting your results...</div>
            </div>
            <div id="quizContainer" class="question-container"></div>
            <div id="emailForm" class="email-form"></div>
            <div id="resultsContainer" class="results"></div>
        </div>
    </div>

    <script>
        // API endpoint for submitting quiz results
        // This calls a Cloudflare Pages Function that securely handles the Notion API
        const API_ENDPOINT = '/api/submit';

        const questions = [
            {
                question: "How often do you experience back pain?",
                answers: [
                    { text: "Rarely or never", value: 0 },
                    { text: "Occasionally, a few times a month", value: 1 },
                    { text: "At least once a week", value: 2 },
                    { text: "Daily or almost daily", value: 3 }
                ]
            },
            {
                question: "Do you feel numbness, tingling, or weakness in arms or legs?",
                answers: [
                    { text: "No, never", value: 0 },
                    { text: "Rarely", value: 1 },
                    { text: "Occasionally", value: 2 },
                    { text: "Frequently or constantly", value: 3 }
                ]
            },
            {
                question: "How does sitting for long periods affect your pain?",
                answers: [
                    { text: "No pain, I can sit comfortably", value: 0 },
                    { text: "Mild discomfort after sitting for an hour or more", value: 1 },
                    { text: "Pain increases significantly after 30 minutes", value: 2 },
                    { text: "I can't sit for long due to intense pain", value: 3 }
                ]
            },
            {
                question: "Have you been diagnosed with a herniated disc, sciatica, or degenerative disc disease?",
                answers: [
                    { text: "No", value: 0 },
                    { text: "Unsure", value: 1 },
                    { text: "Yes, but it's mild", value: 2 },
                    { text: "Yes, and it significantly affects my life", value: 3 }
                ]
            },
            {
                question: "Do you experience stiffness or loss of flexibility in your back?",
                answers: [
                    { text: "No stiffness, full range of motion", value: 0 },
                    { text: "Slight stiffness in the morning or after activity", value: 1 },
                    { text: "Noticeable stiffness that affects movement", value: 2 },
                    { text: "Severe stiffness or reduced mobility", value: 3 }
                ]
            },
            {
                question: "How often do you feel sharp pain in your back or legs?",
                answers: [
                    { text: "Never", value: 0 },
                    { text: "Occasionally", value: 1 },
                    { text: "Frequently", value: 2 },
                    { text: "Constantly", value: 3 }
                ]
            },
            {
                question: "Have you tried other treatments for your back pain?",
                answers: [
                    { text: "No, I haven't needed any", value: 0 },
                    { text: "Yes, and they provided relief", value: 1 },
                    { text: "Yes, but relief was temporary", value: 2 },
                    { text: "Yes, but nothing has helped", value: 3 }
                ]
            },
            {
                question: "How does standing or walking for long periods affect your back?",
                answers: [
                    { text: "No effect, I feel fine", value: 0 },
                    { text: "Slight discomfort after a long time", value: 1 },
                    { text: "Pain starts after a short period", value: 2 },
                    { text: "I avoid standing or walking due to pain", value: 3 }
                ]
            },
            {
                question: "Do you feel pain when bending forward, lifting objects, or twisting?",
                answers: [
                    { text: "No pain", value: 0 },
                    { text: "Mild pain sometimes", value: 1 },
                    { text: "Significant pain during these movements", value: 2 },
                    { text: "Extreme pain, or I completely avoid these movements", value: 3 }
                ]
            },
            {
                question: "Have you noticed your posture getting worse over time?",
                answers: [
                    { text: "No, my posture is fine", value: 0 },
                    { text: "Slight slouching but no pain", value: 1 },
                    { text: "Noticeable posture issues and discomfort", value: 2 },
                    { text: "Severe posture problems affecting daily life", value: 3 }
                ]
            }
        ];

        let currentQuestion = 0;
        let answers = [];
        let userEmail = '';

        function renderQuestion(index) {
            const container = document.getElementById('quizContainer');
            const q = questions[index];
            
            const questionDiv = document.createElement('div');
            questionDiv.className = 'question';
            questionDiv.innerHTML = `
                <div class="question-number">Question ${index + 1} of ${questions.length}</div>
                <h2 class="question-text">${q.question}</h2>
                <div class="answers">
                    ${q.answers.map((answer, i) => `
                        <div class="answer" data-value="${answer.value}">
                            <div class="answer-text">${answer.text}</div>
                        </div>
                    `).join('')}
                </div>
                <div class="navigation">
                    <button class="btn btn-secondary" id="prevBtn" ${index === 0 ? 'style="visibility: hidden"' : ''}>
                        Previous
                    </button>
                    <button class="btn btn-primary" id="nextBtn" disabled>
                        ${index === questions.length - 1 ? 'See Results' : 'Next Question'}
                    </button>
                </div>
            `;

            container.appendChild(questionDiv);
            
            setTimeout(() => {
                questionDiv.classList.add('active');
            }, 10);

            // Add click handlers
            const answerElements = questionDiv.querySelectorAll('.answer');
            answerElements.forEach(answer => {
                answer.addEventListener('click', () => {
                    answerElements.forEach(a => a.classList.remove('selected'));
                    answer.classList.add('selected');
                    answers[index] = parseInt(answer.dataset.value);
                    document.getElementById('nextBtn').disabled = false;
                });
            });

            // Restore previous answer if exists
            if (answers[index] !== undefined) {
                const selectedAnswer = questionDiv.querySelector(`[data-value="${answers[index]}"]`);
                if (selectedAnswer) {
                    selectedAnswer.classList.add('selected');
                    document.getElementById('nextBtn').disabled = false;
                }
            }

            document.getElementById('nextBtn').addEventListener('click', nextQuestion);
            if (index > 0) {
                document.getElementById('prevBtn').addEventListener('click', previousQuestion);
            }

            updateProgress();
        }

        function nextQuestion() {
            const currentQuestionDiv = document.querySelector('.question.active');
            currentQuestionDiv.classList.remove('active');
            currentQuestionDiv.classList.add('exit');

            setTimeout(() => {
                currentQuestionDiv.remove();
                currentQuestion++;
                
                if (currentQuestion < questions.length) {
                    renderQuestion(currentQuestion);
                } else {
                    // Show email form instead of results
                    showEmailForm();
                }
            }, 500);
        }

        function previousQuestion() {
            const currentQuestionDiv = document.querySelector('.question.active');
            currentQuestionDiv.classList.remove('active');
            currentQuestionDiv.classList.add('exit');

            setTimeout(() => {
                currentQuestionDiv.remove();
                currentQuestion--;
                renderQuestion(currentQuestion);
            }, 500);
        }

        function updateProgress() {
            const progress = ((currentQuestion + 1) / questions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }

        function showEmailForm() {
            document.getElementById('quizContainer').style.display = 'none';
            
            const emailForm = document.getElementById('emailForm');
            emailForm.innerHTML = `
                <div class="email-form-container">
                    <h2>Almost There!</h2>
                    <p>Enter your information to receive your personalized spinal health assessment results</p>
                    <div class="email-input-group">
                        <label for="nameInput">Full Name <span style="color: var(--text-light); font-weight: normal;">(required)</span></label>
                        <input 
                            type="text" 
                            id="nameInput" 
                            placeholder="John Doe"
                            autocomplete="name"
                        />
                        <div class="error-message" id="nameError">Please enter your name</div>
                    </div>
                    <div class="email-input-group">
                        <label for="emailInput">Email Address <span style="color: var(--text-light); font-weight: normal;">(required)</span></label>
                        <input 
                            type="email" 
                            id="emailInput" 
                            placeholder="your.email@example.com"
                            autocomplete="email"
                        />
                        <div class="error-message" id="emailError">Please enter a valid email address</div>
                    </div>
                    <div class="email-input-group">
                        <label for="phoneInput">Phone Number <span style="color: var(--text-light); font-weight: normal;">(optional)</span></label>
                        <input 
                            type="tel" 
                            id="phoneInput" 
                            placeholder="(555) 123-4567"
                            autocomplete="tel"
                        />
                        <div class="error-message" id="phoneError">Please enter a valid phone number</div>
                    </div>
                    <div class="success-message" id="successMessage">✓ Results submitted successfully!</div>
                    <button class="btn btn-primary" id="submitEmailBtn" style="width: 100%;">
                        Get My Results
                    </button>
                </div>
            `;
            
            emailForm.classList.add('active');
            
            const nameInput = document.getElementById('nameInput');
            const emailInput = document.getElementById('emailInput');
            const phoneInput = document.getElementById('phoneInput');
            const submitBtn = document.getElementById('submitEmailBtn');
            const nameError = document.getElementById('nameError');
            const emailError = document.getElementById('emailError');
            const phoneError = document.getElementById('phoneError');
            
            // Focus on name input
            setTimeout(() => nameInput.focus(), 100);
            
            // Name validation
            nameInput.addEventListener('input', () => {
                nameInput.classList.remove('error');
                nameError.classList.remove('show');
            });
            
            // Email validation
            emailInput.addEventListener('input', () => {
                emailInput.classList.remove('error');
                emailError.classList.remove('show');
            });
            
            // Phone validation (optional)
            phoneInput.addEventListener('input', () => {
                phoneInput.classList.remove('error');
                phoneError.classList.remove('show');
            });
            
            // Submit handler
            submitBtn.addEventListener('click', handleEmailSubmit);
            nameInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    emailInput.focus();
                }
            });
            emailInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    phoneInput.focus();
                }
            });
            phoneInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    handleEmailSubmit();
                }
            });
        }

        function validateEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }

        function validatePhone(phone) {
            if (!phone || phone.trim() === '') return true; // Optional field
            // Remove all non-digit characters
            const digits = phone.replace(/\D/g, '');
            // Check if it has 10 or 11 digits (with or without country code)
            return digits.length >= 10 && digits.length <= 11;
        }

        async function handleEmailSubmit() {
            const nameInput = document.getElementById('nameInput');
            const emailInput = document.getElementById('emailInput');
            const phoneInput = document.getElementById('phoneInput');
            const name = nameInput.value.trim();
            const email = emailInput.value.trim();
            const phone = phoneInput.value.trim();
            const nameError = document.getElementById('nameError');
            const emailError = document.getElementById('emailError');
            const phoneError = document.getElementById('phoneError');
            const submitBtn = document.getElementById('submitEmailBtn');
            
            // Validate name
            if (!name || name.length < 2) {
                nameInput.classList.add('error');
                nameError.classList.add('show');
                return;
            }
            
            // Validate email
            if (!email || !validateEmail(email)) {
                emailInput.classList.add('error');
                emailError.classList.add('show');
                return;
            }
            
            // Validate phone (optional but if provided, must be valid)
            if (phone && !validatePhone(phone)) {
                phoneInput.classList.add('error');
                phoneError.textContent = 'Please enter a valid phone number';
                phoneError.classList.add('show');
                return;
            }
            
            userEmail = email;
            submitBtn.disabled = true;
            
            // Show loading overlay
            document.getElementById('loadingOverlay').classList.add('active');
            
            try {
                // Submit to Notion and GoHighLevel
                await submitToNotion(name, email, phone);
                
                // Show success message briefly
                document.getElementById('successMessage').classList.add('show');
                
                // Wait a moment then show results
                setTimeout(() => {
                    document.getElementById('loadingOverlay').classList.remove('active');
                    document.getElementById('emailForm').classList.remove('active');
                    showResults();
                }, 1000);
                
            } catch (error) {
                console.error('Error submitting to Notion:', error);
                // Show error message to user
                const errorMsg = document.getElementById('emailError');
                errorMsg.textContent = `Submission failed: ${error.message}. Results will still be shown.`;
                errorMsg.classList.add('show');
                errorMsg.style.color = 'var(--danger)';
                
                // Show results anyway, even if Notion submission fails
                setTimeout(() => {
                    document.getElementById('loadingOverlay').classList.remove('active');
                    document.getElementById('emailForm').classList.remove('active');
                    showResults();
                }, 2000);
            }
        }

        async function submitToNotion(name, email, phone) {
            // Send quiz data to Cloudflare Pages Function
            // The function will securely handle the Notion API call and GoHighLevel integration
            console.log('Submitting to:', API_ENDPOINT);
            console.log('Data:', { name, email, phone, answers, questionsCount: questions.length });
            
            const response = await fetch(API_ENDPOINT, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    name: name,
                    email: email,
                    phone: phone || '', // Send empty string if not provided
                    answers: answers,
                    questions: questions
                })
            });
            
            console.log('Response status:', response.status);
            
            if (!response.ok) {
                let errorMessage = 'Unknown error';
                try {
                    const errorData = await response.json();
                    console.error('Error response:', errorData);
                    errorMessage = errorData.error || errorData.message || JSON.stringify(errorData);
                } catch (e) {
                    errorMessage = `HTTP ${response.status}: ${response.statusText}`;
                }
                throw new Error(errorMessage);
            }
            
            const result = await response.json();
            console.log('Success:', result);
            return result;
        }

        function showResults() {
            const totalScore = answers.reduce((sum, val) => sum + val, 0);
            const maxScore = questions.length * 3;
            const percentage = Math.round((totalScore / maxScore) * 100);

            let severity, severityClass, title, description, recommendation;

            if (percentage <= 25) {
                severity = "Excellent Spinal Health";
                severityClass = "severity-low";
                title = "Great News!";
                description = "Your spinal health appears to be in excellent condition. You're experiencing minimal to no discomfort, which suggests good posture habits and spinal care. Continue maintaining your current lifestyle and preventive practices.";
                recommendation = "Keep up your healthy habits and consider regular check-ups to maintain optimal spinal health.";
            } else if (percentage <= 50) {
                severity = "Moderate Concerns";
                severityClass = "severity-moderate";
                title = "Time for Attention";
                description = "You're experiencing some spinal discomfort that warrants attention. While not severe, these symptoms suggest your spine could benefit from targeted care and lifestyle adjustments to prevent progression.";
                recommendation = "We recommend consulting with a spinal health specialist to develop a personalized care plan.";
            } else {
                severity = "Significant Concerns";
                severityClass = "severity-high";
                title = "Immediate Action Recommended";
                description = "Your responses indicate significant spinal health challenges that are affecting your daily life. These symptoms suggest you could greatly benefit from professional evaluation and comprehensive treatment.";
                recommendation = "We strongly recommend scheduling a consultation with our spinal health experts as soon as possible.";
            }

            const resultsHTML = `
                <div class="score-circle">${percentage}<span style="font-size: 1.25rem;">%</span></div>
                <div class="severity-badge ${severityClass}">${severity}</div>
                <h2>${title}</h2>
                <p class="results-description">${description}</p>
                <p class="results-description">${recommendation}</p>
                <div class="cta-buttons">
                    <a href="https://drjeremiahcox.com/book" target="_blank" class="cta-button">Book Appointment</a>
                    <a href="https://tidycal.com/jeremiahcox98/15-minute-consult" target="_blank" class="cta-button cta-button-secondary">Free 15 Min Call</a>
                </div>
            `;

            const resultsContainer = document.getElementById('resultsContainer');
            resultsContainer.innerHTML = resultsHTML;
            resultsContainer.classList.add('active');
            
            document.getElementById('quizContainer').style.display = 'none';
        }

        // Initialize quiz
        renderQuestion(0);
    </script>
